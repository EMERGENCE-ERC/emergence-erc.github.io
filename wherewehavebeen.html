<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where Have We Been? - EMERGENCE ERC Project</title>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- MarkerCluster -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    
    <link href="assets/css/style.css" rel="stylesheet">
    
    <style>
        #map {
            height: 680px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .legend {
            background: rgba(0,0,0,0.85);
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <!-- Top Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="https://www.universiteitleiden.nl/binaries/content/gallery/ul2/main-images/humanities/research-projects/emergence-project/emergence-project---logo-horizontal.jpg" 
                     alt="EMERGENCE ERC Logo" class="logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="team.html">Team</a></li>
                    <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
                    <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
                    <li class="nav-item"><a class="nav-link" href="publications.html">Publications</a></li>
                    <li class="nav-item"><a class="nav-link" href="database.html">Database</a></li>
                    <li class="nav-item"><a class="nav-link active" href="wherehavewebeen.html">Where Have We Been?</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <section class="py-5" style="background-color: #0a0a0a; margin-top: 70px;">
        <div class="container text-center">
            <h1 class="display-4 fw-bold">Where Have We Been?</h1>
            <p class="lead text-light">Conference presentations and academic activities of the EMERGENCE ERC team</p>
        </div>
    </section>

    <!-- Map -->
    <section class="py-5">
        <div class="container">
            <div id="map"></div>
            
            <!-- Legend -->
            <div class="mt-3 text-center">
                <div class="legend d-inline-block text-start">
                    <strong>Legend:</strong><br>
                    <span style="color:#ffd700">●</span> Keynote Lecture<br>
                    <span style="color:#00b4d8">●</span> Invited Lecture<br>
                    <span style="color:#28a745">●</span> Conference Presentation<br>
                    <span style="color:#ff7f0e">●</span> Conference Roundtable
                </div>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        const map = L.map('map').setView([52.0, 10], 4);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const markers = L.markerClusterGroup({
            showCoverageOnHover: false,
            maxClusterRadius: 50
        });

        function getMarkerColor(type) {
            switch(type?.trim()) {
                case 'Keynote': return '#ffd700';
                case 'Invited lecture': return '#00b4d8';
                case 'Conference presentation': return '#28a745';
                case 'Conference roundtable': return '#ff7f0e';
                default: return '#6c757d';
            }
        }

        Papa.parse('assets/data/presentations.csv', {
            download: true,
            header: true,
            complete: function(results) {
                results.data.forEach(row => {
                    if (!row.Latitude || !row.Longitude) return;

                    const lat = parseFloat(row.Latitude);
                    const lng = parseFloat(row.Longitude);
                    const color = getMarkerColor(row.Type);

                    const marker = L.circleMarker([lat, lng], {
                        radius: 9,
                        fillColor: color,
                        color: "#ffffff",
                        weight: 2.5,
                        opacity: 1,
                        fillOpacity: 0.9
                    });

                    marker.bindPopup(`
                        <strong>${row['Paper title'] || row['Event title']}</strong><br>
                        <em>${row.Type}</em><br>
                        ${row.Speaker}<br>
                        <small>${row['Event title']} • ${row.Date}</small><br>
                        📍 ${row.Location}
                    `);

                    markers.addLayer(marker);
                });

                map.addLayer(markers);
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
