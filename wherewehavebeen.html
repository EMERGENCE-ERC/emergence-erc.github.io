<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where Have We Been? - EMERGENCE ERC Project</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    
    <link href="assets/css/style.css" rel="stylesheet">
    
    <style>
        #map { height: 680px; border-radius: 12px; }
        
        .event-list {
            max-height: 680px;
            overflow-y: auto;
            font-size: 0.84rem;
        }
        .event-item {
            cursor: pointer;
            transition: all 0.2s;
            padding: 10px 14px;
        }
        .event-item:hover {
            background-color: #1a1a1a;
        }
        .event-item strong {
            font-size: 0.97rem;
            line-height: 1.25;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="https://www.universiteitleiden.nl/binaries/content/gallery/ul2/main-images/humanities/research-projects/emergence-project/emergence-project---logo-horizontal.jpg" 
                     alt="EMERGENCE ERC Logo" class="logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="team.html">Team</a></li>
                    <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
                    <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
                    <li class="nav-item"><a class="nav-link" href="publications.html">Publications</a></li>
                    <li class="nav-item"><a class="nav-link" href="database.html">Database</a></li>
                    <li class="nav-item"><a class="nav-link active" href="wherehavewebeen.html">Where Have We Been?</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="py-5" style="background-color: #0a0a0a; margin-top: 70px;">
        <div class="container text-center">
            <h1 class="display-4 fw-bold">Where Have We Been?</h1>
            <p class="lead text-light">Conference presentations and academic activities of the EMERGENCE ERC team</p>
        </div>
    </section>

    <section class="py-4">
        <div class="container">
            <div class="row">
                <div class="col-lg-8">
                    <div id="map"></div>
                </div>
                <div class="col-lg-4">
                    <h5 class="mb-3">All Presentations</h5>
                    <div class="event-list bg-dark p-3 rounded" id="eventList"></div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        const map = L.map('map').setView([52.0, 10], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const markers = L.markerClusterGroup();
        const eventsData = [];

        Papa.parse('assets/data/presentations.csv', {
            download: true,
            header: true,
            complete: function(results) {
                results.data.forEach((row, index) => {
                    if (!row.Latitude || !row.Longitude) return;

                    const lat = parseFloat(row.Latitude);
                    const lng = parseFloat(row.Longitude);
                    const color = getMarkerColor(row.Type);

                    const marker = L.circleMarker([lat, lng], {
                        radius: 9,
                        fillColor: color,
                        color: "#fff",
                        weight: 2.5,
                        fillOpacity: 0.9
                    }).bindPopup(`
                        <strong>${row['Paper title'] || row['Event title']}</strong><br>
                        ${row.Speaker}<br>
                        <small>${row['Event title']} • ${row.Date}</small>
                    `);

                    markers.addLayer(marker);
                    eventsData.push({row, marker, index});
                });

                map.addLayer(markers);
                renderEventList();
            }
        });

        function getMarkerColor(type) {
            switch(type?.trim()) {
                case 'Keynote': return '#ffd700';
                case 'Invited lecture': return '#00b4d8';
                case 'Conference presentation': return '#28a745';
                case 'Conference roundtable': return '#ff7f0e';
                default: return '#6c757d';
            }
        }

        function renderEventList() {
            const container = document.getElementById('eventList');
            container.innerHTML = eventsData.map(item => `
                <div class="event-item rounded mb-2" onclick="zoomToEvent(${item.index})">
                    <strong>${item.row['Paper title'] || item.row['Event title']}</strong><br>
                    <small>${item.row.Speaker} • ${item.row.Date}</small><br>
                    <small class="text-info">${item.row['Event title']}</small>
                </div>
            `).join('');
        }

        window.zoomToEvent = function(index) {
            const item = eventsData[index];
            if (item && item.marker) {
                map.flyTo(item.marker.getLatLng(), 8);
                item.marker.openPopup();
            }
        };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
