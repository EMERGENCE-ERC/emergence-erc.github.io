             <!==== SCRIPT SOURCES ====!>
    
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
            <!==== Load Navbar with JavaScript ====!>
<script>
        fetch('navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-placeholder').innerHTML = data;
            })
            .catch(error => {
                console.error('Failed to load navbar:', error);
            });
</script>

           <!==== Qualtrics form script ====!>
<script>
  // Auto-resize Qualtrics iframe
  function resizeIframe() {
    const iframe = document.getElementById('qualtrics-iframe');
    if (iframe) {
      iframe.style.height = "1400px"; // initial height
      setTimeout(() => {
        const height = iframe.contentWindow.document.body.scrollHeight + 50; // +50 for safety margin
        iframe.style.height = height + "px";
      }, 800); // small delay to let Qualtrics load
    }
  }

  // Run when iframe loads
  document.getElementById('qualtrics-iframe').onload = resizeIframe;

  // Also listen for messages from Qualtrics (better method)
  window.addEventListener('message', function(event) {
    if (event.origin.includes('qualtrics.com') && event.data && event.data.height) {
      document.getElementById('qualtrics-iframe').style.height = event.data.height + 'px';
    }
  });
</script>

</body>
</html>
