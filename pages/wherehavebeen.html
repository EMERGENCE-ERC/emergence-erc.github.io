<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where Have We Been? - EMERGENCE ERC Project</title>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link href="assets/css/style.css" rel="stylesheet">
    
    <style>
        #map {
            height: 650px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .legend {
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <!-- Top Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="https://www.universiteitleiden.nl/binaries/content/gallery/ul2/main-images/humanities/research-projects/emergence-project/emergence-project---logo-horizontal.jpg" 
                     alt="EMERGENCE ERC Logo" class="logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="team.html">Team</a></li>
                    <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
                    <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
                    <li class="nav-item"><a class="nav-link" href="publications.html">Publications</a></li>
                    <li class="nav-item"><a class="nav-link" href="database.html">Database</a></li>
                    <li class="nav-item"><a class="nav-link active" href="wherehavewebeen.html">Where Have We Been?</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <section class="py-5" style="background-color: #0a0a0a; margin-top: 70px;">
        <div class="container text-center">
            <h1 class="display-4 fw-bold">Where Have We Been?</h1>
            <p class="lead text-light">Conference presentations and academic activities of the EMERGENCE ERC team</p>
        </div>
    </section>

    <!-- Map -->
    <section class="py-5">
        <div class="container">
            <div id="map"></div>
        </div>
    </section>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        // Initialize map
        const map = L.map('map').setView([51.5, 10], 4); // Centered on Europe

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Function to load CSV and add markers
        function loadPresentations() {
            Papa.parse('assets/data/presentations.csv', {
                download: true,
                header: true,
                complete: function(results) {
                    results.data.forEach(row => {
                        if (!row.Location || !row.Latitude || !row.Longitude) return;

                        const color = getMarkerColor(row.Type);
                        
                        const marker = L.circleMarker([row.Latitude, row.Longitude], {
                            radius: 8,
                            fillColor: color,
                            color: "#fff",
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 0.8
                        }).addTo(map);

                        marker.bindPopup(`
                            <strong>${row['Paper title'] || row['Event title']}</strong><br>
                            <em>${row.Type}</em><br>
                            ${row.Speaker}<br>
                            <small>${row['Event title']} • ${row.Date}</small><br>
                            📍 ${row.Location}
                        `);
                    });
                }
            });
        }

        function getMarkerColor(type) {
            switch(type) {
                case 'Keynote': return '#ffd700';      // Gold
                case 'Invited lecture': return '#00b4d8'; // Blue
                case 'Conference presentation': return '#28a745'; // Green
                case 'Conference roundtable': return '#ff7f0e'; // Orange
                default: return '#6c757d';
            }
        }

        // Load the data
        loadPresentations();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
