<body>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container text-center">
            <h1 class="display-3 fw-bold mb-3">Where Have We Been?</h1>
            <p class="lead fs-3 mb-5">Conference presentations, keynotes and invited lectures by members of the EMERGENCE project.</p>

    </section>


    <section class="py-3">
        <div class="container">

                <div class="col-lg-8">
                    <div id="map"></div>
                    
                    <!-- Legend under the map -->
                    <div class="text-center mt-3">
                        <div class="legend d-inline-flex flex-wrap justify-content-center gap-4 bg-dark p-3 rounded">
                            <div class="legend-item text-white"><span class="legend-dot" style="background:#ffd700"></span> Keynote <span class="badge bg-light text-dark ms-2" id="count-keynote">0</span></div>
                            <div class="legend-item text-white"><span class="legend-dot" style="background:#00b4d8"></span> Invited Lecture <span class="badge bg-light text-dark ms-2" id="count-invited">0</span></div>
                            <div class="legend-item text-white"><span class="legend-dot" style="background:#28a745"></span> Conference Presentation <span class="badge bg-light text-dark ms-2" id="count-conference">0</span></div>
                            <div class="legend-item text-white"><span class="legend-dot" style="background:#ff7f0e"></span> Conference Roundtable <span class="badge bg-light text-dark ms-2" id="count-roundtable">0</span></div>
                        </div>

                        <!-- Filters line under legend -->
                        <div class="filters-line mt-3">
                            <div class="d-flex justify-content-center gap-3">
                                <select id="filterType" class="form-select form-select-sm" style="width:220px;">
                                    <option value="All">All types</option>
                                    <option value="Keynote">Keynote</option>
                                    <option value="Invited lecture">Invited lecture</option>
                                    <option value="Conference presentation">Conference presentation</option>
                                    <option value="Conference roundtable">Conference roundtable</option>
                                </select>

                                <select id="filterSpeaker" class="form-select form-select-sm" style="width:320px;">
                                    <option value="All">All speakers</option>
                                    <!-- speaker options populated dynamically -->
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-lg-4">
                    <h5 class="mb-3">All Presentations</h5>
                    <div class="event-list bg-dark p-3 rounded" id="eventList"></div>
                </div>
            </div>
        </div>
    </section>

<!-- Footer Placeholder -->
<div id="footer-placeholder"></div>

<!================ ALL SCRIPTS GO DOWN HERE ==============!>
        
             <!==== SCRIPT SOURCES ====!> 
<script src="assets/js/script.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

            <!==== scripts for leaflet.js and PapaParse to generate leaflet.js map from csv ====!>
        
<script>
        const map = L.map('map').setView([52.0, 10], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const markers = L.markerClusterGroup({
            showCoverageOnHover: false,
            maxClusterRadius: 40,           
            disableClusteringAtZoom: 9,     
            spiderfyOnMaxZoom: true,
            zoomToBoundsOnClick: true
            });
        const eventsData = [];

        Papa.parse('assets/data/presentations.csv', {
            download: true,
            header: true,
            complete: function(results) {
                results.data.forEach((row, index) => {
                    if (!row.Latitude || !row.Longitude) return;

                    const lat = parseFloat(row.Latitude);
                    const lng = parseFloat(row.Longitude);
                    const color = getMarkerColor(row.Type);

                    const marker = L.circleMarker([lat, lng], {
                        radius: 9,
                        fillColor: color,
                        color: "#fff",
                        weight: 2.5,
                        fillOpacity: 0.9
                    }).bindPopup(`
                        <strong>${row['Paper title'] || row['Event title']}</strong><br>
                        ${row.Speaker}<br>
                        <em>${row.Type}</em><br>
                        <small>${row['Event title']} • ${row.Date}</small>
                    `);

                    // parse speakers: handle multiple speakers separated by '&' or ' and '\n                    const speakers = (row.Speaker || '').split(/\s*&\s*|\s+and\s+/i).map(s => s.trim()).filter(Boolean);
                    const typeNorm = (row.Type || '').trim();

                    markers.addLayer(marker);
                    eventsData.push({row, marker, originalIndex: index, type: typeNorm, speakers});
                });

                map.addLayer(markers);
                populateSpeakerFilter();
                applyFilters();
            }
        });

        function getMarkerColor(type) {
            switch(type?.trim()) {
                case 'Keynote': return '#ffd700';
                case 'Invited lecture': return '#00b4d8';
                case 'Conference presentation': return '#28a745';
                case 'Conference roundtable': return '#ff7f0e';
                default: return '#6c757d';
            }
        }

        function populateSpeakerFilter() {
            const speakerSet = new Set();
            eventsData.forEach(item => {
                item.speakers.forEach(s => speakerSet.add(s));
            });

            const speakerArray = Array.from(speakerSet).sort((a,b) => a.localeCompare(b));
            const select = document.getElementById('filterSpeaker');
            // keep the default "All"
            speakerArray.forEach(sp => {
                const opt = document.createElement('option');
                opt.value = sp;
                opt.textContent = sp;
                select.appendChild(opt);
            });

            // attach event listeners
            document.getElementById('filterType').addEventListener('change', applyFilters);
            document.getElementById('filterSpeaker').addEventListener('change', applyFilters);
        }

        function applyFilters() {
            const typeFilter = document.getElementById('filterType').value;
            const speakerFilter = document.getElementById('filterSpeaker').value;

            // clear markers and add matching ones
            markers.clearLayers();
            const filtered = eventsData.filter(item => {
                const typeMatch = (typeFilter === 'All') || (item.type === typeFilter);
                const speakerMatch = (speakerFilter === 'All') || (item.speakers.includes(speakerFilter));
                return typeMatch && speakerMatch;
            });

            filtered.forEach(item => markers.addLayer(item.marker));

            updateLegendTotals(filtered);
            renderEventList(filtered);
        }

        function updateLegendTotals(filteredItems) {
            // compute counts per type for the currently filtered set
            const counts = {
                'Keynote': 0,
                'Invited lecture': 0,
                'Conference presentation': 0,
                'Conference roundtable': 0
            };
            filteredItems.forEach(it => {
                if (counts.hasOwnProperty(it.type)) counts[it.type]++;
            });

            document.getElementById('count-keynote').textContent = counts['Keynote'] || 0;
            document.getElementById('count-invited').textContent = counts['Invited lecture'] || 0;
            document.getElementById('count-conference').textContent = counts['Conference presentation'] || 0;
            document.getElementById('count-roundtable').textContent = counts['Conference roundtable'] || 0;
        }

        function renderEventList(filteredItems) {
            const container = document.getElementById('eventList');
            const items = (filteredItems || eventsData).slice();
            // show newest first, assuming CSV is chronological
            container.innerHTML = items.reverse().map(item => `
                <div class="event-item rounded mb-2" onclick="zoomToEvent(${item.originalIndex})">
                    <div class="event-title">${item.row['Paper title'] || item.row['Event title']}</div>
                    <small class="text-info">${item.row.Speaker} • ${item.row.Date} • ${item.row.Type}</small><br>
                    <small><em>${item.row['Event title']}</em></small>
                </div>
            `).join('');

            if (!container.innerHTML) {
                container.innerHTML = '<div class="text-muted">No presentations match the selected filters.</div>';
            }
        }

        window.zoomToEvent = function(index) {
            // index corresponds to the originalIndex saved on eventsData entries
            const item = eventsData.find(it => it.originalIndex === index);
            if (item && item.marker) {
                map.flyTo(item.marker.getLatLng(), 8);
                item.marker.openPopup();
            }
        };
    </script>
        
</body>
