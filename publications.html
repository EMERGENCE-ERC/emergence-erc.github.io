<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Basic Favicon -->
    <link rel="icon" href="assets/images/favicon.png" type="image/png">

    <!-- For better compatibility -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon.png">
    
    <!-- Open Graph / Social Media Preview -->
    <meta property="og:title" content="EMERGENCE - ERC Project @ Leiden University | Publications">
    <meta property="og:description" content="Publications produced by ERC-funded research project at Leiden University exploring the transnational reception of Old English in 19th-century Europe.">
    <meta property="og:image" content="https://emergence-erc.github.io/assets/images/preview/preview.publications.jpg">
    <meta property="og:url" content="https://emergence.leiden.edu">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="EMERGENCE Project">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="EMERGENCE - ERC Project @ Leiden University | Publications">
    <meta name="twitter:description" content="Publications produced by ERC-funded research project at Leiden University exploring the transnational reception of Old English in 19th-century Europe.">
    <meta name="twitter:image" content="https://emergence-erc.github.io/assets/images/preview/preview.publications.jpg">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMERGENCE | Publications</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
    
    <style>
        .publication-item {
            padding: 1.35rem 1.5rem;
            border-bottom: 1px solid #222;
            transition: background-color 0.2s ease;
            border-radius: 6px;
            height: 100%;
            margin-bottom: 0;
            margin-top: 0;
        }
        
        .publication-item:hover {
            background-color: rgba(0, 180, 216, 0.06);
        }

        .pub-year {
            color: #00b4d8;
            font-weight: 700;
            min-width: 74px;
            font-size: 1.13rem;
            margin-bottom: 0.2rem;
        }

        .pub-title {
            color: #ffffff;
            font-size: 1.17rem;
            line-height: 1.42;
            margin-bottom: 0.45rem;
        }

        .author-line {
            color: #cccccc;
            font-size: 0.97rem;
        }

        .pub-journal {
            color: #00b4d8;
            font-weight: 500;
        }

        .pub-image {
            width: 120px;
            max-height: 160px;
            object-fit: contain;
            border: 1px solid #333;
            border-radius: 6px;
            background-color: #111;
            flex-shrink: 0;
        }

        .pub-link { 
            font-size: 0.95rem; 
        }

        .left-column {
            min-width: 110px;
        }
        .row.g-4 {
            --bs-gutter-y: 1.25rem;
        }
    </style>
</head>
<body>
    <!-- Top Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="https://www.universiteitleiden.nl/binaries/content/gallery/ul2/main-images/humanities/research-projects/emergence-project/emergence-project---logo-horizontal.jpg" 
                     alt="EMERGENCE ERC Logo" class="logo" style="max-height: 50px;">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="team.html">Team</a></li>
                    <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
                    <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
                    <li class="nav-item"><a class="nav-link active" href="publications.html">Publications</a></li>
                    <li class="nav-item"><a class="nav-link" href="database.html">Database</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="text-center py-5" style="background-color: #0a0a0a; margin-top: 70px;">
        <div class="container">
            <h1 class="display-4 fw-bold mb-2">Publications</h1>
            <p class="lead text-light">Research outputs from members of the EMERGENCE Project</p>
        </div>
    </section>

    <!-- Publications List -->
    <section class="py-5">
        <div class="container">
            <div class="row g-4" id="publicationsList"></div>
        </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        Papa.parse('assets/data/publications.csv', {
            download: true,
            header: true,
            complete: function(results) {
                const container = document.getElementById('publicationsList');
                let html = '';

                results.data.forEach(row => {
                    if (!row.Title) return;

                    let linkHTML = '';
                    const isOpenAccess = row['Open Access'] && row['Open Access'].toLowerCase() === 'yes';
                    if (row.Link) {
                        const linkText = isOpenAccess ? 'Open Access' : 'Link';
                        const linkColor = isOpenAccess ? '#FFD700' : '';
                        const colorStyle = linkColor ? `style="color: ${linkColor};"` : 'class="text-info"';
                        linkHTML = `<a href="${row.Link}" target="_blank" ${colorStyle} class="pub-link">${linkText}</a>`;
                    }

                    let imageHTML = '';
                    if (row.Image) {
                        const imgSrc = row.Image.startsWith('http') ? row.Image : `assets/images/publications/${row.Image}`;
                        imageHTML = `<img src="${imgSrc}" alt="Journal or Book Cover" class="pub-image">`;
                    }

                    html += `
                        <div class="col-12 col-lg-6">
                            <div class="publication-item h-100">
                                <div class="d-flex flex-column flex-sm-row gap-3 gap-sm-4 h-100">
                                    
                                    <!-- Left Column: Year + Image -->
                                    <div class="left-column d-flex flex-column align-items-start align-items-sm-center">
                                        <div class="pub-year mb-3">${row.Date}</div>
                                        ${imageHTML ? imageHTML : '<div style="width:120px; height:160px;"></div>'}
                                    </div>
                                    
                                    <!-- Main Content -->
                                    <div class="flex-grow-1">
                                        <h5 class="pub-title">${row.Title}</h5>
                                        <p class="author-line mb-1">${row.Author} • ${row.Type}</p>
                                        <p class="pub-journal mb-0">${row['Published in'] || ''}</p>
                                        ${linkHTML ? `<p class="pub-journal mb-0 mt-2">${linkHTML}</p>` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>`;
                });

                container.innerHTML = html;
            }
        });
    </script>

    <!-- Footer -->
    <footer class="py-5 text-center border-top border-secondary mt-5">
        <div class="container">
            <p class="mb-0 text-info">© EMERGENCE 2026. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
