<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publications - EMERGENCE ERC Project</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
    
    <style>
        .publication-item {
            padding: 1.6rem 0;
            border-bottom: 1px solid #333;
        }
        .publication-item:last-child {
            border-bottom: none;
        }
        .pub-year {
            color: #00b4d8;
            font-weight: 600;
            min-width: 70px;
        }
        .pub-title {
            color: #ffffff;
            font-size: 1.22rem;
            line-height: 1.35;
        }
        .pub-journal {
            color: #00b4d8;
        }
        .author-line {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <!-- Top Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="https://www.universiteitleiden.nl/binaries/content/gallery/ul2/main-images/humanities/research-projects/emergence-project/emergence-project---logo-horizontal.jpg" 
                     alt="EMERGENCE ERC Logo" class="logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="team.html">Team</a></li>
                    <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
                    <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
                    <li class="nav-item"><a class="nav-link active" href="publications.html">Publications</a></li>
                    <li class="nav-item"><a class="nav-link" href="database.html">Database</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="py-5" style="background-color: #0a0a0a; margin-top: 70px;">
        <div class="container text-center">
            <h1 class="display-4 fw-bold">Publications</h1>
            <p class="lead text-light">Research outputs from members of the EMERGENCE Project</p>
        </div>
    </section>

    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-11" id="publicationsList"></div>
            </div>
        </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        Papa.parse('assets/data/publications.csv', {
            download: true,
            header: true,
            complete: function(results) {
                const container = document.getElementById('publicationsList');
                let html = '';

                results.data.sort((a, b) => b.Date.localeCompare(a.Date));

                results.data.forEach(row => {
                    if (!row.Title) return;

                    let linkHTML = '';
                    if (row.Link) {
                        const linkText = (row['Open Access'] && row['Open Access'].toLowerCase() === 'yes') 
                            ? 'Open Access' 
                            : 'Link';
                        linkHTML = `<a href="${row.Link}" target="_blank" class="text-info">${linkText}</a>`;
                    }

                    html += `
                        <div class="publication-item">
                            <div class="d-flex">
                                <div class="pub-year">${row.Date}</div>
                                <div class="flex-grow-1">
                                    <h5 class="pub-title">${row.Title}</h5>
                                    <p class="author-line mb-1">${row.Author} | ${row.Type}</p>
                                    <p class="pub-journal">
                                        ${row['Published in'] || ''}
                                        ${row.Link ? ` | ${linkHTML}` : ''}
                                    </p>
                            </div>
                        </div>`;
                });

                container.innerHTML = html;
            }
        });
    </script>

        <!-- Footer -->
    <footer class="py-5 text-center border-top border-secondary mt-5">
        <div class="container">
            <p class="mb-0 text-info">© EMERGENCE 2026. All rights reserved.</p>
        </div>
    </footer>
    
</body>
</html>
